<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>

<style>
/* Layout: one calm column like a card-index drawer; each person is a 90×50 mini card, details slide up as a sheet */
:root{
  --bg:#F2F4F3; --surface:#FFFFFF; --ink:#18222D; --muted:#5B6973; --line:#DCE2E0;
  --accent:#0F6B62; --accent-ink:#FFFFFF; --accent-soft:#E0EEEB;
  --warn:#A9531B; --warn-soft:#F7E9DE; --danger:#B3261E;
  --shadow:0 1px 2px rgba(24,34,45,.06),0 4px 14px rgba(24,34,45,.06);
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11161A; --surface:#1A2126; --ink:#E6ECEA; --muted:#93A1A7; --line:#2C363B;
  --accent:#55C2B2; --accent-ink:#0C1F1C; --accent-soft:#16332F;
  --warn:#E59A62; --warn-soft:#3A2618; --danger:#F08A80;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11161A; --surface:#1A2126; --ink:#E6ECEA; --muted:#93A1A7; --line:#2C363B;
  --accent:#55C2B2; --accent-ink:#0C1F1C; --accent-soft:#16332F;
  --warn:#E59A62; --warn-soft:#3A2618; --danger:#F08A80;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25); color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:760px;margin:0 auto}
header.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-block:28px 18px}
h1{font-size:26px;font-weight:700;letter-spacing:-.02em;margin:0;line-height:1.2;text-wrap:balance}
.count{font-family:var(--f-mono);font-size:12px;color:var(--muted);letter-spacing:.04em;margin-top:4px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 13px;cursor:pointer;font-size:14px;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--ink);border-color:var(--line)}
.btn.danger{color:var(--danger)}
.btn[disabled]{opacity:.5;cursor:default}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.card:focus-visible,.chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.banner{border:1px solid var(--warn);background:var(--warn-soft);color:var(--ink);border-radius:10px;padding:10px 14px;font-size:14px;margin-bottom:14px}
.searchbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:10px 4px;margin-inline:-4px;padding-inline:4px}
.search{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.qbox{flex:1 1 240px;min-width:0;position:relative;display:flex;align-items:center}
.qbox svg{position:absolute;left:13px;width:18px;height:18px;color:var(--muted);pointer-events:none}
.qbox input{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:12px 40px 12px 40px;font-size:15.5px}
.qbox input:focus{border-color:var(--accent)}
.qbox kbd{position:absolute;right:10px;font-family:var(--f-mono);font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 5px}
.qbox input:not(:placeholder-shown)~kbd{display:none}
mark{background:var(--accent-soft);color:var(--ink);border-radius:2px;padding:0 1px}
.card .hit{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.group{margin-top:18px}
.group:first-child{margin-top:4px}
.group-head{display:flex;align-items:baseline;gap:8px;border-bottom:1px solid var(--line);padding-bottom:6px}
.group-head h3{font-size:15px;font-weight:700;margin:0;min-width:0;overflow-wrap:anywhere}
.group-head span{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.drive-note{font-size:13.5px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px;margin-bottom:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.drive-note.err{border-color:var(--danger)}
.drive-note a{color:var(--accent);font-weight:500}
.search select{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 10px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 11px;font-size:13px;cursor:pointer;color:var(--muted)}
.chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
.label{font-size:12px;font-weight:500;letter-spacing:.06em;color:var(--muted);text-transform:uppercase}
section.due{margin-top:22px}
.due-list{display:grid;gap:6px;margin-top:8px}
.due-row{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 12px;cursor:pointer;text-align:left;width:100%}
.due-row:hover{border-color:var(--muted)}
.due-row .who{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill{font-size:12px;font-weight:500;border-radius:999px;padding:2px 9px;white-space:nowrap;font-variant-numeric:tabular-nums}
.pill.over{background:var(--warn-soft);color:var(--warn)}
.pill.soon{background:var(--accent-soft);color:var(--accent)}
section.list{margin-top:24px}
.list-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;margin-top:10px}
.card{position:relative;aspect-ratio:9/5;max-width:100%;background:var(--surface);border:1px solid var(--line);border-radius:6px;box-shadow:var(--shadow);padding:12px 14px;cursor:pointer;text-align:left;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden}
.card:hover{border-color:var(--muted)}
.card .co{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:20px}
.card .nm{font-size:17px;font-weight:700;letter-spacing:-.01em;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .tt{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .ph{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .dot{position:absolute;top:11px;right:12px;width:8px;height:8px;border-radius:50%;background:var(--warn)}
.card .cam{position:absolute;bottom:10px;right:12px;font-size:10px;font-family:var(--f-mono);color:var(--muted);letter-spacing:.05em}
/* view switch + spreadsheet view */
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:2px}
.seg button{border:0;background:transparent;border-radius:8px;padding:8px 11px;cursor:pointer;color:var(--muted);font-size:14px;display:inline-flex;align-items:center;gap:5px}
.seg button svg{width:16px;height:16px}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--ink);font-weight:500}
.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
body.wide .wrap{max-width:1440px}
.tbl-wrap{margin-top:10px;overflow:auto;max-height:calc(100vh - 140px);border:1px solid var(--line);border-radius:8px;background:var(--surface)}
table.tbl{border-collapse:separate;border-spacing:0;width:max-content;min-width:100%;font-size:13.5px}
.tbl th,.tbl td{padding:7px 10px;border-bottom:1px solid var(--line);border-right:1px solid var(--line);text-align:left;white-space:nowrap;max-width:240px;overflow:hidden;text-overflow:ellipsis;vertical-align:top}
.tbl th{position:sticky;top:0;z-index:2;background:var(--bg);font-size:12.5px;font-weight:600;color:var(--muted);cursor:pointer;user-select:none}
.tbl th:hover{color:var(--ink)}
.tbl th .ar{font-family:var(--f-mono);font-size:11px;margin-left:3px;color:var(--accent)}
.tbl th:first-child,.tbl td:first-child{position:sticky;left:0;z-index:1;background:var(--surface);font-weight:600}
.tbl th:first-child{z-index:3;background:var(--bg)}
.tbl td.num{font-family:var(--f-mono);font-size:12.5px}
.tbl td.wrap-cell{max-width:320px}
.tbl tbody tr{cursor:pointer}
.tbl tbody tr:hover td{background:var(--accent-soft)}
.tbl tbody tr:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.tbl .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--warn);margin-right:6px;vertical-align:middle}
.tbl .muted{color:var(--muted)}
.empty{border:1px dashed var(--line);border-radius:12px;padding:28px 20px;text-align:center;color:var(--muted);margin-top:10px}
.empty strong{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
.empty .actions{justify-content:center;margin-top:14px}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,14,18,.42);z-index:20}
.sheet{position:fixed;z-index:21;left:0;right:0;bottom:0;max-height:92%;overflow:auto;background:var(--surface);border-radius:16px 16px 0 0;box-shadow:0 -8px 30px rgba(0,0,0,.18);padding:18px 18px calc(22px + env(safe-area-inset-bottom,0px))}
@media (min-width:820px){.sheet{left:auto;top:0;bottom:0;width:480px;max-height:none;border-radius:0;padding-top:calc(20px + env(safe-area-inset-top,0px))}}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}@media (min-width:820px){.sheet{animation:side .22s ease-out}}}
@keyframes up{from{transform:translateY(24px);opacity:.6}}
@keyframes side{from{transform:translateX(24px);opacity:.6}}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.sheet-head h2{font-size:19px;margin:0;font-weight:700}
.photo{width:100%;aspect-ratio:9/5;border-radius:8px;border:1px solid var(--line);background:var(--bg);display:grid;place-items:center;overflow:hidden;color:var(--muted);font-size:13px}
.photo img{width:100%;height:100%;object-fit:contain}
.big-name{font-size:24px;font-weight:700;letter-spacing:-.02em;margin:14px 0 2px}
.sub{color:var(--muted)}
dl.info{display:grid;grid-template-columns:72px 1fr auto;gap:8px 10px;margin:16px 0;align-items:center}
dl.info dt{font-size:12.5px;color:var(--muted)}
dl.info dd{margin:0;min-width:0;overflow-wrap:anywhere;user-select:text}
dl.info dd.mono{font-family:var(--f-mono);font-size:14px}
.copy{border:none;background:transparent;color:var(--muted);cursor:pointer;font-size:12px;padding:2px 6px;border-radius:6px}
.copy:hover{color:var(--accent);background:var(--accent-soft)}
.block{border-top:1px solid var(--line);padding-top:14px;margin-top:14px}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:12.5px;background:var(--accent-soft);color:var(--ink);border-radius:999px;padding:2px 10px}
.memo{white-space:pre-wrap;margin:6px 0 0}
.log{display:grid;gap:8px;margin-top:10px}
.log-item{display:grid;grid-template-columns:86px 1fr auto;gap:8px;align-items:start;font-size:14px}
.log-item time{font-family:var(--f-mono);font-size:12.5px;color:var(--muted);padding-top:2px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row input[type=text]{flex:1 1 180px;min-width:0}
.field{display:grid;gap:4px}
.field label{font-size:12.5px;color:var(--muted)}
.field input,.field textarea,.row input,.row select,.map select{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:9px 11px;font-size:15px;width:100%}
.row input[type=date]{width:auto}
.field textarea{min-height:80px;resize:vertical}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form .full{grid-column:1/-1}
@media (max-width:480px){.form{grid-template-columns:1fr}}
.drop{border:1.5px dashed var(--line);border-radius:10px;padding:16px;text-align:center;color:var(--muted);cursor:pointer;display:grid;gap:8px;place-items:center}
.drop:hover{border-color:var(--accent);color:var(--ink)}
.drop img{max-height:180px;border-radius:6px}
.status{font-size:13.5px;color:var(--muted);min-height:1.4em}
.status.err{color:var(--danger)}
.status.ok{color:var(--accent)}
.footer-actions{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:18px}
.map{display:grid;grid-template-columns:110px 1fr;gap:8px 10px;align-items:center;margin-top:10px}
.map label{font-size:13.5px}
.preview{overflow-x:auto;margin-top:12px;border:1px solid var(--line);border-radius:8px}
.preview table{border-collapse:collapse;font-size:12.5px;min-width:100%}
.preview th,.preview td{border-bottom:1px solid var(--line);padding:6px 9px;text-align:left;white-space:nowrap}
.preview th{color:var(--muted);font-weight:500}
.plan-nums{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.plan-nums span{border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12.5px;color:var(--muted);display:grid}
.plan-nums b{font-size:20px;color:var(--ink);font-variant-numeric:tabular-nums;font-weight:700}
.changes{display:grid;gap:6px;margin-top:10px;font-size:13.5px}
.chg{min-width:0;overflow-wrap:anywhere}
.chg s{color:var(--muted)}
.check{display:flex;gap:8px;align-items:flex-start;margin-top:14px;font-size:14px;cursor:pointer}
.check input{margin-top:4px;accent-color:var(--accent)}
.help{font-size:13.5px;color:var(--muted);margin:6px 0 0}
.share-pick{display:grid;gap:2px;margin-top:6px}
.share-pick .check{margin-top:6px;min-width:0;overflow-wrap:anywhere}
.share-ways{display:grid;gap:12px;margin-top:16px}
.way{border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:grid;gap:10px;min-width:0}
.way .help{margin:0}
.way-head{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.badge{font-size:12px;font-weight:700;border-radius:6px;padding:2px 8px}
.badge.sms{background:var(--accent-soft);color:var(--accent)}
.badge.kakao{background:#FEE500;color:#191600}
.badge.img{background:var(--warn-soft);color:var(--warn)}
.kakao-btn{background:#FEE500;border-color:#E6CF00;color:#191600}
.kakao-btn:hover{filter:brightness(.97);border-color:#C9B500}
a.btn{text-decoration:none}
.share-canvas{width:100%;max-width:100%;height:auto;aspect-ratio:9/5;border:1px solid var(--line);border-radius:6px;background:#fff}
.field textarea#shText{min-height:150px;font-size:14.5px}
.vh{position:fixed;left:0;top:0;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none}
label.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.file-btn{position:relative;overflow:hidden}
.file-btn input[type=file],.pick-opt input[type=file]{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:40px;margin:0}
.file-btn:focus-within,.pick-opt:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.picker{display:grid;gap:8px}
.pick-opt{position:relative;overflow:hidden;display:flex;align-items:center;gap:14px;width:100%;text-align:left;border:1px solid var(--line);border-radius:12px;padding:13px 16px;background:var(--bg);font-size:16px;font-weight:500;cursor:pointer}
.pick-opt:hover{border-color:var(--muted)}
.pick-opt .ic{flex:none;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.pick-opt .ic .ico{width:20px;height:20px}
.pick-opt small{display:block;font-size:12.5px;color:var(--muted);font-weight:400}
.gate{margin-top:20px}
.gate-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:30px 22px;display:grid;gap:12px;justify-items:center;text-align:center;max-width:440px;margin:0 auto;box-shadow:var(--shadow)}
.gate-card h2{margin:0;font-size:21px}
.gate-card p{margin:0;color:var(--muted);max-width:34ch}
.gate-card img{border-radius:14px}
.gate-card code{font-family:var(--f-mono);font-size:13px;background:var(--bg);border-radius:4px;padding:1px 5px}
body.locked .searchbar,body.locked .due,body.locked .list,body.locked #btnImport,body.locked #btnExport,body.locked #btnPick{display:none}
.raw{margin-top:8px}
body.locked #btnTidy{display:none}
/* card cropper: four draggable corners over the original photo */
.crop-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
.crop-row .status{flex:1 1 100%}
#dropInner{display:grid;gap:6px;justify-items:center}
.cropper{position:relative;touch-action:none;user-select:none;-webkit-user-select:none;line-height:0;margin:14px auto;max-width:calc(100% - 28px)}
.cropper canvas{width:100%;height:auto;display:block;border-radius:6px;background:#000}
.cropper svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.cropper path{fill:rgba(0,0,0,.5)}
.cropper polygon{fill:none;stroke:#55C2B2;stroke-width:2.5;vector-effect:non-scaling-stroke}
.hdl{position:absolute;width:40px;height:40px;margin:-20px 0 0 -20px;border-radius:50%;cursor:grab;touch-action:none;display:grid;place-items:center}
.hdl::after{content:"";width:20px;height:20px;border-radius:50%;border:3px solid #fff;background:rgba(15,107,98,.75);box-shadow:0 1px 4px rgba(0,0,0,.6)}
.hdl:focus-visible{outline:2px solid #fff;outline-offset:-4px}
.hdl[data-drag]::after{background:#55C2B2;transform:scale(1.15)}
.raw summary{cursor:pointer;color:var(--muted);font-size:13.5px}
.raw textarea{width:100%;margin-top:6px;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:9px 11px;font-size:14px;font-family:var(--f-mono)}
.ico{width:17px;height:17px;flex:none}
.pick-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.pick-row .btn{justify-content:center}
.match{border:1px solid var(--accent);background:var(--accent-soft);border-radius:10px;padding:12px 14px;margin-top:14px;display:grid;gap:10px;font-size:14px}
.match>strong{font-size:15px}
.match .help{margin:0}
.match-list{display:grid;gap:6px}
.match-row{display:flex;gap:10px;align-items:center;justify-content:space-between;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.match-row>div{min-width:0;overflow-wrap:anywhere}
.match-row small{display:block;color:var(--muted);font-size:12.5px}
.match .changes{margin-top:0}
.match .check{margin-top:0}
.match .chg-new{color:var(--accent);font-weight:500}
.match input[type=search]{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 11px;font-size:15px;width:100%}
.just{border:1px solid var(--accent);background:var(--accent-soft);border-radius:10px;padding:10px 12px;margin-bottom:12px;display:grid;gap:8px;font-size:14px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:14px;z-index:40;box-shadow:var(--shadow)}
</style>

</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>내 명함첩</h1>
      <div class="count" id="count">불러오는 중…</div>
    </div>
    <div class="actions">
      <button class="btn ghost" id="btnImport" type="button">가져오기</button>
      <button class="btn ghost" id="btnExport" type="button">엑셀 받기</button>
      <button class="btn ghost" id="btnTidy" type="button" hidden>사진 자르기</button>
      <button class="btn" id="btnInstall" type="button" hidden>앱 설치</button>
      <button class="btn ghost" id="btnAccount" type="button" hidden>계정</button>
      <button class="btn primary" id="btnPick" data-act="pick" type="button"><svg class="ico" viewBox="0 0 20 20" aria-hidden="true"><path d="M3 6.5h3l1.4-2h5.2l1.4 2h3v9.5H3z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><circle cx="10" cy="11" r="3" fill="none" stroke="currentColor" stroke-width="1.7"/></svg>명함 추가</button>
    </div>
  </header>

  <div class="banner" id="banner" hidden></div>
  <div class="drive-note" id="tidyNote" role="status" hidden></div>
  <div class="gate" id="gate" hidden></div>

  <div class="searchbar">
    <div class="search">
      <div class="qbox">
        <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M13 13l4.5 4.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" fill="none"/></svg>
        <input id="q" type="search" placeholder="이름, 회사, 직책, 전화번호 일부, 이메일, 주소, 메모, 태그" autocomplete="off" aria-label="명함 검색">
        <kbd>/</kbd>
      </div>
      <select id="sort" aria-label="보기 방식">
        <option value="company">회사별로 묶기</option>
        <option value="recent">최근 등록순</option>
        <option value="name">이름순</option>
      </select>
      <div class="seg" role="group" aria-label="보기 형태">
        <button type="button" data-view="card" aria-pressed="true" title="카드로 보기"><svg viewBox="0 0 16 16" aria-hidden="true"><rect x="1.5" y="2.5" width="5.5" height="4.5" rx="1" fill="none" stroke="currentColor" stroke-width="1.4"/><rect x="9" y="2.5" width="5.5" height="4.5" rx="1" fill="none" stroke="currentColor" stroke-width="1.4"/><rect x="1.5" y="9" width="5.5" height="4.5" rx="1" fill="none" stroke="currentColor" stroke-width="1.4"/><rect x="9" y="9" width="5.5" height="4.5" rx="1" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>카드</button>
        <button type="button" data-view="table" aria-pressed="false" title="표로 보기"><svg viewBox="0 0 16 16" aria-hidden="true"><rect x="1.5" y="2" width="13" height="12" rx="1" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M1.5 6h13M1.5 10h13M6 2v12" stroke="currentColor" stroke-width="1.4" fill="none"/></svg>표</button>
      </div>
    </div>
    <div class="chips" id="chips"></div>
  </div>

  <section class="due" id="due" hidden>
    <div class="label">연락할 사람</div>
    <div class="due-list" id="dueList"></div>
  </section>

  <section class="list">
    <div class="list-head"><div class="label" id="listLabel">전체 명함</div></div>
    <div id="listArea"></div>
  </section>
</div>

<div class="scrim" id="scrim" hidden></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" hidden></section>
<div class="toast" id="toast" hidden></div>

<script>
(() => {
  "use strict";
  const $ = (s, r = document) => r.querySelector(s);
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const digits = s => String(s ?? "").replace(/\D/g, "");
  const pad = n => String(n).padStart(2, "0");
  const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const today = () => ymd(new Date());
  const addDays = (str, n) => { const d = new Date(str + "T00:00:00"); d.setDate(d.getDate() + n); return ymd(d); };
  const addMonths = (str, n) => { const d = new Date(str + "T00:00:00"); d.setMonth(d.getMonth() + n); return ymd(d); };
  const diffDays = (a, b) => Math.round((new Date(a + "T00:00:00") - new Date(b + "T00:00:00")) / 86400000);

  const FIELDS = [
    ["name", "이름"], ["company", "회사"], ["dept", "부서"], ["title", "직책"],
    ["mobile", "휴대폰"], ["phone", "유선전화"], ["fax", "팩스"], ["email", "이메일"],
    ["address", "주소"], ["website", "웹사이트"], ["metAt", "만난 곳"], ["metDate", "만난 날"],
    ["tags", "태그"], ["memo", "메모"]
  ];
  const LABEL = Object.fromEntries(FIELDS);

  const state = { cards: [], q: "", tag: "", sort: "company", view: "card", tk: "", tdir: 1, mode: "loading", loaded: false };
  let db = null, uid = null, vault = null, cardsCol = null, photosCol = null, downloads = null, imageOK = true, installEvt = null;
  const local = { photos: {} };
  let tidyBusy = false;

  // ---------- storage (Firebase Firestore, 오프라인에서도 동작) ----------
  // 쓰기는 기기 안 저장소에 바로 반영되고, 인터넷이 연결되면 클라우드로 올라갑니다.
  // 서버 응답을 끝까지 기다리면 지하철 같은 곳에서 화면이 멈추므로 잠깐만 기다립니다.
  function settle(p) {
    let late = false;
    p.catch(e => { if (late) toast(errText(e)); });
    return Promise.race([p, new Promise(r => setTimeout(r, 1200))]).finally(() => { late = true; });
  }
  const store = {
    async save(id, data) {
      if (state.mode !== "db") { const i = state.cards.findIndex(c => c.id === id); const row = { ...data, id }; if (i >= 0) state.cards[i] = row; else state.cards.push(row); render(); return; }
      await settle(cardsCol.doc(id).set(data));
    },
    async del(id) {
      if (state.mode !== "db") { state.cards = state.cards.filter(c => c.id !== id); delete local.photos[id]; render(); return; }
      photosCol.doc(id).delete().catch(() => {});
      await settle(cardsCol.doc(id).delete());
    },
    async photoGet(id) {
      if (state.mode !== "db") return local.photos[id] || null;
      const s = await photosCol.doc(id).get(); return s.exists ? (s.data().data || null) : null;
    },
    async photoSet(id, dataUrl) {
      if (state.mode !== "db") { local.photos[id] = dataUrl; return; }
      await settle(photosCol.doc(id).set({ data: dataUrl }));
    },
    newId() { return cardsCol ? cardsCol.doc().id : "c" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
  };

  function errText(e) {
    const c = e && e.code;
    if (c === "permission-denied") return "저장 권한이 없습니다. 로그아웃 후 다시 로그인해 주세요.";
    if (c === "resource-exhausted") return "오늘 쓸 수 있는 무료 저장 횟수를 넘었습니다. 내일 다시 시도해 주세요.";
    if (c === "invalid-argument") return "내용이 너무 커서 저장하지 못했습니다.";
    if (c === "unavailable") return "인터넷에 연결되지 않았습니다. 연결되면 자동으로 저장됩니다.";
    return "저장하지 못했습니다. 잠시 후 다시 시도해 주세요.";
  }

  // ---------- render ----------
  function cardText(c) {
    return [c.name, c.company, c.dept, c.title, c.email, c.address, c.memo, c.metAt, (c.tags || []).join(" ")].join(" ").toLowerCase();
  }
  function filtered() {
    const q = state.q.trim().toLowerCase();
    const qd = digits(q);
    let list = state.cards.filter(c => {
      if (state.tag && !(c.tags || []).includes(state.tag)) return false;
      if (!q) return true;
      if (cardText(c).includes(q)) return true;
      if (qd.length >= 3 && [c.mobile, c.phone, c.fax].some(p => digits(p).includes(qd))) return true;
      return false;
    });
    const coll = new Intl.Collator("ko");
    if (state.sort === "name") list.sort((a, b) => coll.compare(a.name || "", b.name || ""));
    else if (state.sort === "company") list.sort((a, b) => (!(a.company || "").trim() - !(b.company || "").trim()) || coll.compare((a.company || "").trim(), (b.company || "").trim()) || coll.compare(a.name || "", b.name || ""));
    else list.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
    return list;
  }
  function dueInfo(c) {
    if (!c.nextContact) return null;
    const d = diffDays(c.nextContact, today());
    if (d > 7) return null;
    if (d < 0) return { cls: "over", text: `${-d}일 지남`, d };
    if (d === 0) return { cls: "over", text: "오늘", d };
    return { cls: "soon", text: `${d}일 후`, d };
  }

  function render() {
    const n = state.cards.length;
    $("#count").textContent = !state.loaded ? "불러오는 중…" : `명함 ${n.toLocaleString("ko-KR")}장`;
    if (!tidyBusy) $("#btnTidy").hidden = !state.cards.some(c => c.hasPhoto && !c.photoCut);

    const allTags = [...new Set(state.cards.flatMap(c => c.tags || []))].sort((a, b) => a.localeCompare(b, "ko"));
    if (state.tag && !allTags.includes(state.tag)) state.tag = "";
    $("#chips").innerHTML = allTags.length ? [`<button class="chip ${state.tag ? "" : "on"}" data-tag="" type="button">전체</button>`]
      .concat(allTags.map(t => `<button class="chip ${state.tag === t ? "on" : ""}" data-tag="${esc(t)}" type="button">#${esc(t)}</button>`)).join("") : "";

    const due = state.cards.map(c => ({ c, i: dueInfo(c) })).filter(x => x.i).sort((a, b) => a.i.d - b.i.d);
    $("#due").hidden = !due.length;
    $("#dueList").innerHTML = due.slice(0, 8).map(({ c, i }) =>
      `<button class="due-row" data-id="${esc(c.id)}" type="button"><span class="who"><strong>${esc(c.name || "(이름 없음)")}</strong> <span class="sub">${esc([c.company, c.title].filter(Boolean).join(" · "))}</span></span><span class="pill ${i.cls}">${i.text}</span></button>`).join("");

    const list = filtered();
    $("#listLabel").textContent = state.q || state.tag ? `검색 결과 ${list.length}장` : "전체 명함";
    const area = $("#listArea");
    if (!state.loaded) { area.innerHTML = `<div class="empty">명함첩을 여는 중입니다…</div>`; return; }
    if (!n) {
      area.innerHTML = `<div class="empty"><strong>아직 등록된 명함이 없습니다</strong>명함 사진을 올리면 이름·회사·연락처를 자동으로 채워 드립니다. 리멤버에서 내보낸 엑셀 파일도 한 번에 가져올 수 있어요.<div class="actions"><button class="btn primary" data-act="pick" type="button">+ 첫 명함 추가</button><button class="btn" data-act="import" type="button">리멤버 엑셀 가져오기</button></div></div>`;
      return;
    }
    if (!list.length) { area.innerHTML = `<div class="empty">찾는 명함이 없습니다. 다른 검색어를 넣어 보세요.</div>`; return; }
    const q = state.q.trim();
    if (state.view === "table") { area.innerHTML = tableHtml(list, q); return; }
    const cardHtml = c => {
      const i = dueInfo(c);
      const hit = matchLine(c, q);
      return `<button class="card" data-id="${esc(c.id)}" type="button">
        ${i && i.cls === "over" ? `<span class="dot" title="연락할 때가 됐어요"></span>` : ""}
        <span class="co">${hl(c.company || " ", q)}</span>
        <span><span class="nm" style="display:block">${hl(c.name || "(이름 없음)", q)}</span><span class="tt" style="display:block">${hl([c.dept, c.title].filter(Boolean).join(" · ") || " ", q)}</span></span>
        ${hit ? `<span class="hit">${hit}</span>` : `<span class="ph">${hl(c.mobile || c.phone || c.email || " ", q)}</span>`}
        ${c.hasPhoto && !hit ? `<span class="cam">PHOTO</span>` : ""}
      </button>`;
    };
    if (state.sort === "company") {
      const groups = new Map();
      for (const c of list) { const k = (c.company || "").trim() || "￿"; if (!groups.has(k)) groups.set(k, []); groups.get(k).push(c); }
      area.innerHTML = [...groups].map(([k, cs]) => `<div class="group"><div class="group-head"><h3>${k === "￿" ? "회사 미입력" : hl(k, q)}</h3><span>${cs.length}명</span></div><div class="grid">${cs.map(cardHtml).join("")}</div></div>`).join("");
    } else {
      area.innerHTML = `<div class="grid">` + list.map(cardHtml).join("") + `</div>`;
    }
  }

  // ---------- spreadsheet view ----------
  const COLS = [
    ["name", "이름"], ["company", "회사"], ["dept", "부서"], ["title", "직책"],
    ["mobile", "휴대폰", "num"], ["phone", "유선전화", "num"], ["fax", "팩스", "num"], ["email", "이메일"],
    ["address", "주소", "wrap-cell"], ["website", "웹사이트"], ["tags", "태그"], ["metAt", "만난 곳"],
    ["metDate", "만난 날", "num"], ["nextContact", "다음 연락", "num"], ["memo", "메모", "wrap-cell"], ["createdAt", "등록일", "num"]
  ];
  const cellVal = (c, k) => {
    if (k === "tags") return (c.tags || []).map(t => "#" + t).join(" ");
    if (k === "createdAt") return c.createdAt ? ymd(new Date(c.createdAt)) : "";
    return String(c[k] ?? "").replace(/\s+/g, " ").trim();
  };
  function tableHtml(list, q) {
    if (state.tk) {
      const coll = new Intl.Collator("ko", { numeric: true });
      const k = state.tk, dir = state.tdir;
      list = list.slice().sort((a, b) => {
        const va = k === "createdAt" ? (a.createdAt || 0) : cellVal(a, k), vb = k === "createdAt" ? (b.createdAt || 0) : cellVal(b, k);
        const ea = va === "" || va === 0, eb = vb === "" || vb === 0;
        if (ea || eb) return ea - eb; // 빈 칸은 항상 아래로
        return (typeof va === "number" ? va - vb : coll.compare(va, vb)) * dir;
      });
    }
    const head = COLS.map(([k, label]) => `<th data-tk="${k}" scope="col" title="눌러서 정렬">${label}${state.tk === k ? `<span class="ar">${state.tdir > 0 ? "▲" : "▼"}</span>` : ""}</th>`).join("");
    const rows = list.map(c => {
      const i = dueInfo(c);
      const tds = COLS.map(([k, , cls]) => {
        const v = cellVal(c, k);
        const inner = k === "name"
          ? (i && i.cls === "over" ? `<span class="dot" title="연락할 때가 됐어요"></span>` : "") + (v ? hl(v, q) : `<span class="muted">(이름 없음)</span>`)
          : hl(v, q);
        return `<td${cls ? ` class="${cls}"` : ""}${v.length > 18 ? ` title="${esc(v)}"` : ""}>${inner}</td>`;
      }).join("");
      return `<tr data-id="${esc(c.id)}" tabindex="0">${tds}</tr>`;
    }).join("");
    return `<div class="tbl-wrap"><table class="tbl"><thead><tr>${head}</tr></thead><tbody>${rows}</tbody></table></div>`;
  }
  function setView(v) {
    state.view = v === "table" ? "table" : "card";
    document.body.classList.toggle("wide", state.view === "table");
    document.querySelectorAll(".seg [data-view]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.view === state.view)));
    try { localStorage.setItem("cb.view", state.view); } catch {}
  }

  // Highlight the search term inside already-plain text.
  function hl(text, q) {
    const s = String(text ?? "");
    if (!q) return esc(s);
    const i = s.toLowerCase().indexOf(q.toLowerCase());
    if (i < 0) return esc(s);
    return esc(s.slice(0, i)) + "<mark>" + esc(s.slice(i, i + q.length)) + "</mark>" + esc(s.slice(i + q.length));
  }
  // When the match is in a field the mini card doesn't show, say where it matched.
  function matchLine(c, q) {
    if (!q) return "";
    const ql = q.toLowerCase(), qd = digits(q);
    const shown = [c.name, c.company, c.dept, c.title].join(" ").toLowerCase();
    if (shown.includes(ql)) return "";
    for (const k of ["mobile", "phone", "fax"]) if (qd.length >= 3 && digits(c[k]).includes(qd)) return `<span class="sub">${LABEL[k]}</span> <mark>${esc(c[k])}</mark>`;
    for (const k of ["email", "address", "metAt", "memo"]) {
      const v = String(c[k] || ""); const i = v.toLowerCase().indexOf(ql);
      if (i >= 0) { const st = Math.max(0, i - 12); return `<span class="sub">${LABEL[k]}</span> ${st ? "…" : ""}${hl(v.slice(st, i + q.length + 30).replace(/\s+/g, " "), q)}`; }
    }
    const t = (c.tags || []).find(t => t.toLowerCase().includes(ql));
    if (t) return `<span class="sub">태그</span> #${hl(t, q)}`;
    return "";
  }

  // ---------- sheet ----------
  const sheet = $("#sheet"), scrim = $("#scrim");
  let lastFocus = null;
  function openSheet(html, focusSel) {
    lastFocus = document.activeElement;
    sheet.innerHTML = html; sheet.hidden = false; scrim.hidden = false;
    sheet.scrollTop = 0;
    const f = focusSel && $(focusSel, sheet); (f || sheet.querySelector("button")).focus({ preventScroll: true });
  }
  function closeSheet() { sheet.hidden = true; scrim.hidden = true; sheet.innerHTML = ""; if (lastFocus && lastFocus.focus) lastFocus.focus(); }
  scrim.addEventListener("click", closeSheet);
  document.addEventListener("keydown", e => { if (e.key === "Escape" && !sheet.hidden) closeSheet(); });

  let toastT = 0;
  function toast(msg) { const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 2200); }

  async function copy(text, btn) {
    try { await navigator.clipboard.writeText(text); toast("복사했습니다"); }
    catch { const dd = btn.closest("dl") && btn.previousElementSibling; if (dd) { const r = document.createRange(); r.selectNodeContents(dd); const s = getSelection(); s.removeAllRanges(); s.addRange(r); toast("선택했습니다. 복사해 주세요"); } }
  }

  // ---------- detail ----------
  function showDetail(id, opt = {}) {
    const c = state.cards.find(x => x.id === id); if (!c) return;
    const rows = [["mobile", 1], ["phone", 1], ["fax", 1], ["email", 0], ["address", 0], ["website", 0]].filter(([k]) => c[k]);
    const met = [c.metDate, c.metAt].filter(Boolean).join(" · ");
    const log = (c.log || []).slice().sort((a, b) => (b.d || "").localeCompare(a.d || ""));
    const nc = c.nextContact || "";
    const i = dueInfo(c);
    openSheet(`
      <div class="sheet-head"><h2>명함 정보</h2><button class="btn ghost" data-act="close" type="button">닫기</button></div>
      ${opt.justAdded || opt.justUpdated ? `<div class="just"><span>${opt.justUpdated ? "명함을 업데이트했습니다. 바뀐 내용은 연락 기록에 남겼어요." : "명함을 등록했습니다."} 이어서 다음 명함을 찍을 수 있어요.</span><div class="row"><span class="btn primary file-btn"><svg class="ico" viewBox="0 0 20 20" aria-hidden="true"><path d="M3 6.5h3l1.4-2h5.2l1.4 2h3v9.5H3z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><circle cx="10" cy="11" r="3" fill="none" stroke="currentColor" stroke-width="1.7"/></svg>다음 명함 촬영<input id="nx_cam" type="file" accept="image/*" capture="environment" aria-label="다음 명함 촬영"></span><button class="btn" data-act="pick" type="button">다른 방법으로 추가</button></div></div>` : ""}
      ${c.hasPhoto ? `<div class="photo" id="photoBox">사진 불러오는 중…</div>` : ""}
      <div class="big-name">${esc(c.name || "(이름 없음)")}</div>

  // ---------- card finder: locate the business card in a photo and straighten it ----------
  const CardCrop = (() => {
    const clampI = (v, a, b) => v < a ? a : v > b ? b : v;
    function boxBlur(a, W, H, r) {
      const t = new Float32Array(a.length), k = 2 * r + 1;
      for (let y = 0; y < H; y++) {
        const row = y * W; let s = 0;
        for (let x = -r; x <= r; x++) s += a[row + clampI(x, 0, W - 1)];
        for (let x = 0; x < W; x++) { t[row + x] = s / k; s += a[row + Math.min(W - 1, x + r + 1)] - a[row + Math.max(0, x - r)]; }
      }
      for (let x = 0; x < W; x++) {
        let s = 0;
        for (let y = -r; y <= r; y++) s += t[clampI(y, 0, H - 1) * W + x];
        for (let y = 0; y < H; y++) { a[y * W + x] = s / k; s += t[Math.min(H - 1, y + r + 1) * W + x] - t[Math.max(0, y - r) * W + x]; }
      }
    }
    // binary morphology with a square window (separable)

    if (PHONE_OK[k]) return !PHONE_OK[k].test(to) ? "번호 형식이 이상해요" : "";
    if (k === "email") return /^[^@\s]+@[^@\s]+\.[a-z]{2,}$/i.test(to) ? "" : "주소 형식이 이상해요";
    if (!from || k === "title") return ""; // 직책 변경(과장→차장)은 흔한 실제 변화
    const a = normV(k, from), b = normV(k, to);
    if (Math.max(a.length, b.length) < 6) return ""; // 짧은 값은 한 글자 차이도 실제 변경일 수 있음
    return lev(a, b) <= Math.max(1, Math.floor(Math.max(a.length, b.length) * 0.12)) ? "글자 몇 개만 달라요" : "";
  }
  function readForm() {
    const g = k => (($("#f_" + k) || {}).value || "").trim(), d = {};
    for (const [k] of FIELDS) if (k !== "tags") d[k] = g(k);
    d.tags = [...new Set(g("tags").split(/[,，#]/).map(s => s.trim()).filter(Boolean))];
    return d;
  }
  function findMatches(d) {
    const m = digits(d.mobile), e = String(d.email || "").trim().toLowerCase(), nm = normV("name", d.name), co = normCo(d.company), ph = digits(d.phone);
    return state.cards.map(c => {
      let sc = 0; const why = [];
      if (m.length >= 9 && digits(c.mobile) === m) { sc += 4; why.push("휴대폰"); }
      if (e && String(c.email || "").trim().toLowerCase() === e) { sc += 4; why.push("이메일"); }
      if (nm.length >= 2 && normV("name", c.name) === nm) { sc += 2; why.push("이름"); }
      if (co.length >= 2 && normCo(c.company) === co) { sc += 1; why.push("회사"); }
      if (ph.length >= 9 && digits(c.phone) === ph && sc) { sc += 1; why.push("전화"); }
      return { c, sc, why };
    }).filter(x => x.sc >= 2).sort((a, b) => b.sc - a.sc).slice(0, 3);
  }
  const whoLine = c => esc([c.company, c.dept, c.title].filter(Boolean).join(" · ") || c.mobile || c.email || "");

  // 업데이트 미리보기: 바뀌는 항목마다 체크(기본 선택), 새 값이 빈 항목은 기존 값을 그대로 둠
  function showDiff(mid, o = {}) {
    const box = $("#matchBox"), c = state.cards.find(x => x.id === mid); if (!box || !c) return;

    const diffs = MERGE_KEYS.filter(k => d[k] && normV(k, d[k]) !== normV(k, c[k])).map(k => ({ k, from: c[k] || "", to: d[k], sus: suspect(k, c[k] || "", d[k]) }));
    box.innerHTML = `<div class="match">
      <strong>${esc(c.name || c.company || "")}님 명함 업데이트</strong>
      ${o.waiting && !diffs.length ? `<p class="help">명함을 읽고 나면 바뀐 내용을 여기에 보여 드립니다.</p>` : diffs.length ? `<p class="help">바꿀 항목을 확인하세요. 체크를 풀면 기존 값을 그대로 둡니다.</p>
      <div class="changes">${diffs.map(x => `<label class="check chg"><input type="checkbox" data-mk="${x.k}" ${(x.k in keep ? keep[x.k] : !x.sus) ? "checked" : ""}><span><span class="sub">${LABEL[x.k]}</span> ${x.from ? `<s>${esc(x.from)}</s> → ` : ""}<span class="chg-new">${esc(x.to)}</span>${x.from ? "" : ` <span class="sub">(새 항목)</span>`}${x.sus ? `<br><span class="sub" style="font-size:12.5px">${x.sus}. 잘못 읽었을 수 있어 체크하지 않았습니다.</span>` : ""}</span></label>`).join("")}</div>` : `<p class="help">기존 명함과 다른 내용이 없습니다.</p>`}
      ${pendingPhoto ? `<label class="check"><input type="checkbox" id="mgPhoto" ${keepPhoto ? "checked" : ""}> 명함 사진을 새 사진으로 바꾸기</label>` : ""}
      ${diffs.length ? `<label class="check"><input type="checkbox" id="mgLog" ${keepLog ? "checked" : ""}> 바뀐 내용을 연락 기록에 남기기</label>` : ""}
      <p class="help">메모·연락 기록·태그·다음 연락일은 그대로 둡니다.</p>
      <div class="row"><button class="btn primary" data-act="mergeapply" type="button">업데이트</button><button class="btn ghost" data-act="mergesearch" type="button">다른 사람 선택</button><button class="btn ghost" data-act="mergenew" type="button">새 명함으로 등록</button></div>

  async function applyMerge() {
    const mid = sheet.dataset.mergeId, c = state.cards.find(x => x.id === mid); if (!c) return;
    const d = readForm(), st = $("#mergeStatus");
    const picked = MERGE_KEYS.filter(k => { const x = $(`#matchBox input[data-mk="${k}"]`); return x && x.checked; });
    const patch = {}, notes = [];
    for (const k of picked) {
      patch[k] = d[k];
      if (["company", "dept", "title"].includes(k)) notes.push(`${LABEL[k]} ${c[k] ? c[k] + " → " : ""}${d[k]}`);

    // 새 명함 화면에 직접 적은 태그·메모·만남 정보도 잃지 않게 합침
    const tags = [...new Set([...(c.tags || []), ...d.tags])]; if (tags.length !== (c.tags || []).length) patch.tags = tags;
    if (d.memo && !String(c.memo || "").includes(d.memo)) patch.memo = c.memo ? c.memo + "\n" + d.memo : d.memo;

  }

  // ---------- import ----------
  const PATTERNS = [
    ["mobile", /휴대|핸드폰|모바일|mobile|cell/i],
    ["fax", /팩스|fax/i],

  function showImport() {

  function decodeText(buf) {
    try { return new TextDecoder("utf-8", { fatal: true }).decode(buf); }
    catch { try { return new TextDecoder("euc-kr").decode(buf); } catch { return new TextDecoder().decode(buf); } }
  }
  function normDate(v) {
    const s = String(v || "").trim(); if (!s) return "";
    const m = s.match(/(\d{4})[.\-/년\s]+(\d{1,2})[.\-/월\s]+(\d{1,2})/);
    if (m) return `${m[1]}-${pad(+m[2])}-${pad(+m[3])}`;
    const m2 = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/);
    if (m2) { const y = m2[3].length === 2 ? "20" + m2[3] : m2[3]; return `${y}-${pad(+m2[1])}-${pad(+m2[2])}`; }
    return "";
  }

  async function readImport(file) {
    const body = $("#impBody");
    $("#impName").textContent = file.name;
    if (typeof XLSX === "undefined") { body.innerHTML = `<p class="status err">파일 읽기 도구를 불러오지 못했습니다. 페이지를 새로고침해 주세요.</p>`; return; }
    try {
      const buf = await file.arrayBuffer();
      const wb = /\.csv$/i.test(file.name) ? XLSX.read(decodeText(buf), { type: "string" }) : XLSX.read(buf, { type: "array" });
      const ws = wb.Sheets[wb.SheetNames[0]];
      const raw = XLSX.utils.sheet_to_json(ws, { header: 1, defval: "", raw: false }).map(r => r.map(x => String(x ?? "").trim()));
      let hi = 0;
      for (let i = 0; i < Math.min(10, raw.length); i++) {
        const hits = raw[i].filter(h => h && PATTERNS.some(([, re]) => re.test(h))).length;
        if (hits >= 2) { hi = i; break; }
      }
      const headers = raw[hi] || [];
      const rows = raw.slice(hi + 1).filter(r => r.some(Boolean));
      if (!headers.length || !rows.length) { body.innerHTML = `<p class="status err">파일에서 명함 목록을 찾지 못했습니다. 첫 시트에 열 이름과 명함이 있는지 확인해 주세요.</p>`; return; }
      const used = new Set(), map = {};
      for (const [k, re] of PATTERNS) {
        const idx = headers.findIndex((h, i) => h && !used.has(i) && re.test(h));
        if (idx >= 0) { map[k] = idx; used.add(idx); }
      }
      imp = { headers, rows };
      const opts = sel => `<option value="">(가져오지 않음)</option>` + headers.map((h, i) => `<option value="${i}" ${sel === i ? "selected" : ""}>${esc(h || `열 ${i + 1}`)}</option>`).join("");
      body.innerHTML = `
        <p class="help">${rows.length.toLocaleString("ko-KR")}명의 명함을 찾았습니다. 각 항목이 맞는 열과 연결됐는지 확인하세요.</p>
        <div class="map">${FIELDS.map(([k, l]) => `<label for="m_${k}">${l}</label><select id="m_${k}">${opts(map[k])}</select>`).join("")}</div>
        <div class="label" style="margin-top:16px">파일 미리보기</div>
        <div class="preview" id="impPrev"></div>
        <div class="label" style="margin-top:16px">반영할 내용</div>
        <div id="impPlan"></div>
        <label class="check"><input type="checkbox" id="impUpdate" checked> 이미 있는 명함은 바뀐 정보로 갱신하기 <span class="sub">(메모·연락 기록은 그대로 둡니다)</span></label>
        <div class="status" id="impStatus"></div>
        <div class="footer-actions"><button class="btn ghost" data-act="close" type="button">취소</button><button class="btn primary" data-act="doimport" type="button">반영하기</button></div>`;
      body.querySelectorAll(".map select, #impUpdate").forEach(s => s.addEventListener("change", importPreview));
      importPreview();
    } catch {
      body.innerHTML = `<p class="status err">파일을 읽지 못했습니다. 엑셀(.xlsx) 또는 CSV 파일인지 확인해 주세요.</p>`;
    }
  }
  function mappedRows() {
    const m = {}; for (const [k] of FIELDS) { const v = $("#m_" + k)?.value; if (v !== "" && v != null) m[k] = +v; }
    const hx = n => imp.headers.findIndex(h => String(h).replace(/\s/g, "") === n);

      const o = {}; for (const [k] of FIELDS) o[k] = m[k] != null ? (r[m[k]] || "") : "";
      o.__x = { next: ix.next >= 0 ? r[ix.next] : "", last: ix.last >= 0 ? r[ix.last] : "", log: ix.log >= 0 ? r[ix.log] : "" };
      return o;
    });
  }
  function importPreview() {

    $("#impPlan").innerHTML = `
      <div class="plan-nums"><span><b>${plan.adds.length}</b>새 명함</span><span><b>${plan.updates.length}</b>정보 바뀜</span><span><b>${plan.same.length}</b>변화 없음</span></div>
      ${plan.updates.length ? `<div class="changes">${plan.updates.slice(0, 6).map(u => `<div class="chg"><strong>${esc(u.name || "(이름 없음)")}</strong> ${u.diffs.slice(0, 3).map(d => `<span class="sub">${LABEL[d.k]}</span> ${d.from ? `<s>${esc(d.from)}</s> → ` : ""}${esc(d.to)}`).join(" · ")}${u.diffs.length > 3 ? ` <span class="sub">외 ${u.diffs.length - 3}개</span>` : ""}</div>`).join("")}${plan.updates.length > 6 ? `<div class="sub" style="font-size:13px">외 ${plan.updates.length - 6}명</div>` : ""}</div>` : ""}`;
    const go = sheet.querySelector('[data-act="doimport"]');
    if (go) { const total = plan.adds.length + nUp; go.textContent = total ? `${total}명 반영하기` : "반영할 내용 없음"; go.disabled = !total; }
  }
  // Match imported rows to existing cards and work out what changes.
  const INFO = ["name", "company", "dept", "title", "mobile", "phone", "fax", "email", "address", "website"];
  const norm = (k, v) => ["mobile", "phone", "fax"].includes(k) ? digits(v) : String(v || "").replace(/\s+/g, " ").trim().toLowerCase();
  const splitTags = v => [...new Set(String(v || "").split(/[,，;#/]/).map(s => s.trim()).filter(Boolean))];
  function parseLog(v) {
    return String(v || "").split(/\r?\n/).map(l => l.trim().match(/^(\d{4}-\d{2}-\d{2})\s+(.+)$/)).filter(Boolean)
      .map((m, i) => ({ k: Date.now().toString(36) + i, d: m[1], t: m[2] }));
  }
  function planImport() {
    const byMobile = new Map(), byEmail = new Map(), byNC = new Map();
    const nc = c => (c.name || "").replace(/\s/g, "") + "|" + (c.company || "").replace(/\s/g, "").toLowerCase();
    const index = c => {
      const m = digits(c.mobile); if (m.length >= 8) byMobile.set(m, c);
      const e = (c.email || "").trim().toLowerCase(); if (e) byEmail.set(e, c);
      if (c.name) byNC.set(nc(c), c);
    };
    const pool = state.cards.map(c => ({ ...c }));
    pool.forEach(index);
    const adds = [], updates = [], same = [];
    mappedRows().filter(o => o.name || o.company).forEach(o => {
      const m = digits(o.mobile), e = (o.email || "").trim().toLowerCase();
      const hit = (m.length >= 8 && byMobile.get(m)) || (e && byEmail.get(e)) || (o.name && byNC.get(nc(o)));
      if (!hit) {
        const x = o.__x || {};
        const row = { ...o, tags: splitTags(o.tags), metDate: normDate(o.metDate), nextContact: normDate(x.next), lastContact: normDate(x.last), log: parseLog(x.log) };
        delete row.__x;
        adds.push(row); index(row); return;
      }
      if (!hit.id) { // same person appears twice in the file: fill gaps in the pending new card
        for (const k of [...INFO, "memo"]) if (!hit[k] && String(o[k] || "").trim()) hit[k] = String(o[k]).trim();
        hit.tags = [...new Set([...(hit.tags || []), ...splitTags(o.tags)])];
        index(hit); return;
      }
      const patch = {}, diffs = [];
      for (const k of INFO) {
        const nv = String(o[k] || "").trim();
        if (nv && norm(k, nv) !== norm(k, hit[k])) { patch[k] = nv; diffs.push({ k, from: hit[k] || "", to: nv }); }
      }
      const tags = splitTags(o.tags), oldTags = hit.tags || [];
      const newTags = tags.filter(t => !oldTags.includes(t));
      if (newTags.length) { patch.tags = [...oldTags, ...newTags]; diffs.push({ k: "tags", from: "", to: newTags.map(t => "#" + t).join(" ") }); }
      if (!hit.memo && String(o.memo || "").trim()) { patch.memo = String(o.memo).trim(); diffs.push({ k: "memo", from: "", to: "메모 추가" }); }
      const md = normDate(o.metDate); if (!hit.metDate && md) patch.metDate = md;
      if (!Object.keys(patch).length) { same.push(hit); return; }
      if (hit._planned) { Object.assign(hit._planned.patch, patch); hit._planned.diffs.push(...diffs); }
      else { hit._planned = { id: hit.id, name: patch.name || hit.name, patch, diffs }; updates.push(hit._planned); }
      Object.assign(hit, patch); index(hit);
    });
    return { adds, updates, same };
  }

  async function doImport() {
    const st = $("#impStatus");
    const btns = sheet.querySelectorAll("button"); btns.forEach(b => b.disabled = true);
    const doUpdate = $("#impUpdate")?.checked !== false;
    const plan = planImport();
    const total = plan.adds.length + (doUpdate ? plan.updates.length : 0);
    let added = 0, updated = 0, failed = 0, n = 0;
    const now = Date.now();
    const tick = () => { n++; if (n % 5 === 0 || n === total) { st.className = "status"; st.textContent = `반영하는 중… ${n} / ${total}`; } };
    let stop = false;
    if (doUpdate) for (const u of plan.updates) {
      const cur = state.cards.find(c => c.id === u.id); if (!cur) { tick(); continue; }
      const { id: _, ...rest } = cur;
      const next = { ...rest, ...u.patch, updatedAt: now };
      const job = u.diffs.filter(d => d.k === "company" || d.k === "title");
      if (job.length) next.log = [...(cur.log || []), { k: (now + n).toString(36), d: today(), t: "[정보 변경] " + job.map(d => `${LABEL[d.k]} ${d.from || "(없음)"} → ${d.to}`).join(", ") }];
      try { await store.save(u.id, next); updated++; } catch (e) { failed++; }
      tick();
    }
    for (let i = 0; i < plan.adds.length && !stop; i++) {
      const data = { log: [], nextContact: "", ...plan.adds[i], hasPhoto: false, createdAt: now - i, updatedAt: now };
      try { await store.save(store.newId(), data); added++; }
      catch (e) { failed++; if (e && e.code === "quota_exceeded") { st.className = "status err"; st.textContent = errText(e); stop = true; } }
      tick();
    }
    st.className = failed ? "status err" : "status ok";
    const parts = [];
    if (added) parts.push(`새 명함 ${added}명을 추가했습니다.`);
    if (updated) parts.push(`${updated}명의 바뀐 정보를 반영했습니다.`);
    if (plan.same.length) parts.push(`${plan.same.length}명은 바뀐 게 없었습니다.`);
    if (!doUpdate && plan.updates.length) parts.push(`정보가 바뀐 ${plan.updates.length}명은 그대로 두었습니다.`);
    if (failed) parts.push(`${failed}명은 저장하지 못했습니다.`);
    if (!stop) st.textContent = parts.join(" ") || "반영할 내용이 없었습니다.";
    btns.forEach(b => b.disabled = false);
    const go = sheet.querySelector('[data-act="doimport"]'); if (go) { go.textContent = "완료"; go.dataset.act = "close"; }
  }

  // ---------- export ----------
  // Whole cardbook as an .xlsx, grouped by company like the main view.
  function buildXlsx() {
    const coll = new Intl.Collator("ko");
    const all = state.cards.slice().sort((a, b) => (!(a.company || "").trim() - !(b.company || "").trim()) || coll.compare(a.company || "", b.company || "") || coll.compare(a.name || "", b.name || ""));
    const rows = all.map(c => {
      const o = {}; for (const [k, l] of FIELDS) o[l] = k === "tags" ? (c.tags || []).join(", ") : (c[k] || "");
      o["다음 연락일"] = c.nextContact || "";
      o["최근 연락일"] = c.lastContact || "";
      o["연락 기록"] = (c.log || []).slice().sort((a, b) => (a.d || "").localeCompare(b.d || "")).map(l => `${l.d} ${l.t}`).join("\n");
      return o;
    });
    const ws = XLSX.utils.json_to_sheet(rows);
    ws["!cols"] = [8, 18, 12, 10, 15, 15, 15, 24, 32, 22, 14, 11, 16, 30, 11, 11, 40].map(w => ({ wch: w }));
    ws["!autofilter"] = { ref: ws["!ref"] };
    const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, "명함");
    return new Uint8Array(XLSX.write(wb, { type: "array", bookType: "xlsx" }));
  }

    if (t.dataset.nc && c) {

      <p style="margin:0"><b>${esc(me.email || me.displayName || "")}</b>(으)로 로그인되어 있습니다.</p>
      <p class="help">폰과 PC에서 같은 구글 계정으로 로그인하면 명함이 자동으로 함께 보입니다. 인터넷이 끊겨도 이 기기에 저장해 두었다가 연결되면 올립니다.</p>
      <div class="footer-actions"><button class="btn" id="btnInstall2" data-act="install" type="button" ${installEvt ? "" : "hidden"}>홈 화면에 설치</button><button class="btn danger" data-act="signout" type="button">로그아웃</button></div>`);
    const b2 = $("#btnInstall2"); if (b2) b2.addEventListener("click", () => { closeSheet(); doInstall(); });
  }

  render();
  const cfg = window.FIREBASE_CONFIG;
  if (!window.firebase || !cfg || !cfg.apiKey || /여기에|YOUR_/i.test(cfg.apiKey)) {
    state.loaded = true;
    showGate(window.firebase
      ? `<div class="gate-card"><h2>처음 설정이 필요합니다</h2><p><code>firebase-config.js</code> 파일에 Firebase 설정값을 넣어 주세요. 방법은 설치 안내서(README) 2단계에 있습니다.</p></div>`
      : `<div class="gate-card"><h2>인터넷 연결이 필요합니다</h2><p>처음 열 때는 로그인 도구를 받아야 합니다. 인터넷에 연결한 뒤 새로고침해 주세요.</p></div>`);
  } else {
    firebase.initializeApp(cfg);
    const fdb = firebase.firestore();
    fdb.enablePersistence({ synchronizeTabs: true }).catch(() => {});
    firebase.auth().getRedirectResult().catch(() => {});
    firebase.auth().onAuthStateChanged(user => {
      if (unsub) { unsub(); unsub = null; }
      me = user;
      if (!user) {
        state.cards = []; state.loaded = false; state.mode = "loading"; uid = null; cardsCol = photosCol = null;
        if (!sheet.hidden) closeSheet();
        $("#btnAccount").hidden = true;
        showGate(LOGIN_HTML);
        return;
      }
      hideGate();
      uid = user.uid;
      const acc = $("#btnAccount"); acc.hidden = false; acc.textContent = (user.displayName || user.email || "계정").split(/[\s@]/)[0];
      vault = fdb.collection("users").doc(uid);
      cardsCol = vault.collection("cards");
      photosCol = vault.collection("photos");
      state.mode = "db"; state.loaded = false; render();
      unsub = cardsCol.onSnapshot(snap => {
        state.cards = snap.docs.map(x => ({ ...x.data(), id: x.id }));
        state.loaded = true; render();
        // 다른 기기에서 지운 명함을 보고 있었다면 닫기
        if (!sheet.hidden && sheet.dataset.id && $("#delWrap") && !state.cards.some(x => x.id === sheet.dataset.id)) closeSheet();
      }, err => {
        state.loaded = true; render();
        toast(err && err.code === "permission-denied" ? "명함을 읽을 권한이 없습니다. 설치 안내서 4단계(보안 규칙)를 확인해 주세요." : "명함을 불러오지 못했습니다. 새로고침해 주세요.");
      });
    });
  }

  if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) {
    window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
  }
})();
</script>

</body></html>
